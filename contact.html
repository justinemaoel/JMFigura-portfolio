<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MAOEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="contact-style.css">
</head>
<body>

    <nav class="navbar sticky-top navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">MAOEL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggler">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <div class="row align-items-center g-4 g-md-5">

                <!-- LEFT: info -->
                <div class="col-12 col-md-5 contact-info">
                    <h6 class="fw-bold text-uppercase mb-3" style="letter-spacing: 3px; font-size: 0.75rem;">Get in Touch</h6>
                    <h1>LET'S<br>CREATE<br>SOMETHING<br>GREAT.</h1>
                    <div class="info-divider"></div>
                    <p>Have a project in mind or just want to say hi? Fill out the form and I'll get back to you as soon as possible.</p>
                    <div class="mt-4 d-none d-md-block">
                        <h6 class="fw-bold mb-3" style="letter-spacing: 2px; font-size: 0.75rem; text-transform: uppercase;">Let's Connect</h6>
                        <div class="d-flex gap-3 fs-4">
                            <a href="https://www.facebook.com/justine.maoel" target="_blank" class="text-dark"><i class="bi bi-facebook"></i></a>
                            <a href="https://www.instagram.com/justine.maoel" target="_blank" class="text-dark"><i class="bi bi-instagram"></i></a>
                            <a href="#" class="text-dark"><i class="bi bi-linkedin"></i></a>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: form -->
                <div class="col-12 col-md-7">

                    <form action="https://formspree.io/f/xvzdrovl" method="POST">
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control py-3 rounded-0" placeholder="Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control py-3 rounded-0" placeholder="Email" required>
                        </div>
                        <div class="mb-4">
                            <textarea name="message" class="form-control rounded-0" rows="6" placeholder="Message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark px-5 py-2 rounded-1 fw-bold">Send Message</button>
                    </form>

                    <!-- Mobile-only social links -->
                    <div class="mt-5 d-md-none">
                        <h6 class="fw-bold mb-3" style="letter-spacing: 2px; font-size: 0.75rem; text-transform: uppercase;">Let's Connect</h6>
                        <div class="d-flex gap-3 fs-4">
                            <a href="https://www.facebook.com/justine.maoel" target="_blank" class="text-dark"><i class="bi bi-facebook"></i></a>
                            <a href="https://www.instagram.com/justine.maoel" target="_blank" class="text-dark"><i class="bi bi-instagram"></i></a>
                            <a href="#" class="text-dark"><i class="bi bi-linkedin"></i></a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <footer class="footer-page py-5">
        <div class="container">
            <div class="border-top border-dark pt-4 text-center">
                <h1 class="footer-logo mb-2">MAOEL</h1>
                <p class="small text-secondary mb-0">© 2026 MAOEL. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.querySelectorAll('a').forEach(link => {
            const href = link.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto')) return;
            link.addEventListener('click', function (e) {
                e.preventDefault();
                document.body.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 350);
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
